# nginx-Konfiguration für die statische Website "Mehr mit Mohr".
#
# Der Container spricht nur HTTP auf Port 80. HTTPS übernimmt der
# Reverse-Proxy bzw. Webserver auf dem Host, der hierher weiterleitet.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Weiterleitungen wie /kontakt -> /kontakt/ relativ halten, damit sie
    # hinter einem Reverse-Proxy nicht auf http://…:80 zeigen.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Seiten: /kontakt/ -> /kontakt/index.html, /admin/ -> /admin/index.html.
    # HTML immer frisch prüfen lassen, damit Änderungen aus dem CMS sofort
    # sichtbar sind.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Von Astro und Tina erzeugte Dateien tragen einen Hash im Namen und
    # ändern sich nie – dürfen beliebig lange zwischengespeichert werden.
    location /_astro/ {
        expires max;
    }

    location /admin/assets/ {
        expires max;
    }

    # Hochgeladene Bilder behalten beim Austausch oft ihren Namen, deshalb
    # nur kurz zwischenspeichern.
    location /uploads/ {
        expires 7d;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

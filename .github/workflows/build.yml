name: Website bauen

# Läuft bei jedem Push auf main – also auch dann, wenn die Redaktion in
# TinaCMS auf "Speichern" klickt, denn Tina schreibt ihre Änderungen als
# Commit in dieses Repository.
#
# Ergebnis ist ein Docker-Image in der GitHub-Registry:
#   ghcr.io/dbm-174/mehrmitmohr:latest
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Fehlen die Secrets, bricht der Tina-Build erst tief im Docker-Build
      # mit einer schwer zu findenden Meldung ab – deshalb vorher prüfen.
      - name: Tina-Zugangsdaten prüfen
        env:
          CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
          TOKEN: ${{ secrets.TINA_TOKEN }}
        run: |
          fehlt=""
          [ -n "$CLIENT_ID" ] || fehlt="$fehlt NEXT_PUBLIC_TINA_CLIENT_ID"
          [ -n "$TOKEN" ] || fehlt="$fehlt TINA_TOKEN"
          if [ -n "$fehlt" ]; then
            echo "::error::Repository-Secrets fehlen oder sind leer:$fehlt – einzutragen unter Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: An der GitHub-Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dbm-174/mehrmitmohr:latest
            ghcr.io/dbm-174/mehrmitmohr:${{ github.sha }}
          build-args: |
            SITE_URL=https://kati.dbm-connect.de
            TINA_BRANCH=main
          # Nur während des Builds verfügbar, landen in keiner Image-Schicht.
          secrets: |
            tina_client_id=${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
            tina_token=${{ secrets.TINA_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # HIER FEHLT NOCH DER DEPLOY-SCHRITT
      #
      # Das neue Image liegt nach diesem Workflow in der Registry, der Server
      # holt es aber nicht von selbst. Bis das eingerichtet ist, auf dem
      # Server von Hand:
      #
      #   docker compose pull && docker compose up -d
      #
      # Automatisch per SSH (Werte als Repository-Secrets hinterlegen und
      # die Zeilen einkommentieren):
      #
      # - name: Auf dem Server aktualisieren
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
      #     script: |
      #       cd ${{ secrets.DEPLOY_PFAD }}
      #       docker compose pull
      #       docker compose up -d
      # ------------------------------------------------------------------
